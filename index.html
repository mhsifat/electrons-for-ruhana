<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10^28 Electrons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Noto+Serif+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #050505;
    --purple: #6B4C9A;
    --lavender: #B39CD0;
    --gold: #d4a843;
    --cyan: #4fc3f7;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%;
    height:100%;
    background:var(--void);
    overflow:hidden;
    font-family:'Playfair Display', serif;
  }

  #stage{
    position:relative;
    width:100vw;
    height:100vh;
  }

  canvas{
    position:absolute;
    top:0; left:0;
    width:100vw;
    height:100vh;
    display:block;
    cursor:pointer;
  }

  /* ---------- Overlay layer ---------- */
  .overlay{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:5;
  }

  /* Soft resting core glow, visible before trigger */
  #restGlow{
    position:absolute;
    top:50%; left:50%;
    width:14px;
    height:14px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(212,168,67,0.95) 0%, rgba(212,168,67,0.35) 40%, rgba(212,168,67,0) 72%);
    box-shadow:
      0 0 20px 6px rgba(212,168,67,0.55),
      0 0 60px 20px rgba(212,168,67,0.18);
    animation: restPulse 3.2s ease-in-out infinite;
    transition: opacity 0.6s ease;
  }

  @keyframes restPulse{
    0%, 100%{ transform:translate(-50%,-50%) scale(0.85); opacity:0.55; }
    50%{ transform:translate(-50%,-50%) scale(1.35); opacity:1; }
  }

  #prompt{
    position:absolute;
    top:calc(50% + 70px);
    left:50%;
    transform:translate(-50%, 0);
    color:var(--lavender);
    letter-spacing:0.12em;
    font-size:0.95rem;
    font-weight:400;
    font-style:italic;
    text-transform:uppercase;
    text-shadow:0 0 12px rgba(179,156,208,0.6);
    animation: promptPulse 2.6s ease-in-out infinite;
    transition: opacity 0.8s ease;
    white-space:nowrap;
  }

  @keyframes promptPulse{
    0%, 100%{ opacity:0.35; }
    50%{ opacity:0.95; }
  }

  /* Core name */
  #coreName{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.7);
    font-weight:600;
    font-size:clamp(2.2rem, 8vw, 5rem);
    letter-spacing:0.05em;
    color:#fff3d6;
    opacity:0;
    text-shadow:
      0 0 10px rgba(212,168,67,0.9),
      0 0 30px rgba(212,168,67,0.75),
      0 0 70px rgba(212,168,67,0.5),
      0 0 120px rgba(212,168,67,0.3);
    transition: opacity 1.6s ease, transform 1.6s cubic-bezier(0.22,1,0.36,1);
    z-index:6;
  }

  #coreName.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  /* Final message */
  #finalMessage{
    position:absolute;
    bottom:8%;
    left:50%;
    transform:translate(-50%, 14px);
    width:min(90vw, 640px);
    text-align:center;
    opacity:0;
    transition: opacity 2s ease, transform 2s ease;
    pointer-events:none;
  }

  #finalMessage.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  #finalMessage .bn-text{
    font-family:'Noto Serif Bengali', 'Playfair Display', serif;
    font-size:clamp(1rem, 2.6vw, 1.35rem);
    color:var(--lavender);
    line-height:1.7;
    text-shadow:
      0 0 8px rgba(179,156,208,0.7),
      0 2px 10px rgba(0,0,0,0.9);
    margin-bottom:0.9rem;
    font-weight:500;
  }

  #finalMessage .en-text{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:clamp(0.95rem, 2.2vw, 1.15rem);
    color:#f2e9d8;
    line-height:1.6;
    text-shadow:
      0 0 10px rgba(212,168,67,0.5),
      0 2px 10px rgba(0,0,0,0.9);
    letter-spacing:0.02em;
  }

  #finalMessage .en-text .date{
    display:inline-block;
    margin-top:0.35rem;
    color:var(--gold);
    letter-spacing:0.15em;
    text-transform:uppercase;
    font-style:normal;
    font-size:0.85em;
  }

  /* Flash for the implosion/explosion trigger */
  #flash{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background:radial-gradient(circle at 50% 50%, rgba(255,247,224,1) 0%, rgba(212,168,67,0.9) 18%, rgba(107,76,154,0.6) 40%, rgba(5,5,5,0) 70%);
    opacity:0;
    pointer-events:none;
    z-index:8;
  }

  @media (max-width:520px){
    #prompt{ font-size:0.78rem; top:calc(50% + 54px); }
    #finalMessage{ bottom:6%; }
  }

  @media (prefers-reduced-motion: reduce){
    #restGlow, #prompt{ animation:none; }
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>

  <div class="overlay">
    <div id="restGlow"></div>
    <div id="prompt">Tap to see my universe</div>
    <h1 id="coreName">Ruhana</h1>
    <div id="finalMessage">
      <p class="bn-text">আমার দেহের 10<sup>28</sup> টি ইলেকট্রন অবশেষে তাদের কক্ষপথ খুঁজে পেয়েছে।</p>
      <p class="en-text">I can't wait to revolve around you forever.<br><span class="date">October 16</span></p>
    </div>
  </div>

  <div id="flash"></div>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const restGlow = document.getElementById('restGlow');
  const prompt = document.getElementById('prompt');
  const coreName = document.getElementById('coreName');
  const finalMessage = document.getElementById('finalMessage');
  const flash = document.getElementById('flash');

  let W, H, cx, cy;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#B39CD0', '#6B4C9A', '#d4a843', '#4fc3f7'];

  let triggered = false;
  let startTime = 0;
  let particles = [];
  let sparks = []; // implosion burst particles
  const PARTICLE_COUNT = 800;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  class Particle{
    constructor(){
      this.reset();
      // stagger initial angle/radius so they don't all start in one ring
      this.radius = rand(40, Math.min(W, H) * 0.42);
      this.angle = rand(0, Math.PI * 2);
    }
    reset(){
      this.baseRadius = rand(40, Math.min(W, H) * 0.42);
      this.radius = this.baseRadius;
      this.angle = rand(0, Math.PI * 2);
      this.speed = rand(0.15, 0.9) * (Math.random() < 0.5 ? 1 : -1) / this.baseRadius * 40;
      this.tilt = rand(0.25, 1); // vertical squash for elliptical/3D feel
      this.wobbleAmp = rand(2, 18);
      this.wobbleSpeed = rand(0.3, 1.4);
      this.wobblePhase = rand(0, Math.PI * 2);
      this.size = rand(0.6, 2.2);
      this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      this.tiltAngle = rand(0, Math.PI); // orientation of the orbital plane
      this.depthPhase = rand(0, Math.PI * 2);
      this.depthSpeed = rand(0.2, 0.6);
    }
    update(t){
      this.angle += this.speed * 0.016;
      const wobble = Math.sin(t * this.wobbleSpeed + this.wobblePhase) * this.wobbleAmp;
      const r = this.radius + wobble;

      // base orbit in local plane
      const lx = Math.cos(this.angle) * r;
      const ly = Math.sin(this.angle) * r * this.tilt;

      // rotate plane by tiltAngle for a 3D-ish varied ellipse look
      const rx = lx * Math.cos(this.tiltAngle) - ly * Math.sin(this.tiltAngle);
      const ry = lx * Math.sin(this.tiltAngle) + ly * Math.cos(this.tiltAngle);

      // subtle depth pulsation affecting apparent size
      this.depthFactor = 0.6 + 0.4 * Math.sin(t * this.depthSpeed + this.depthPhase);

      this.x = cx + rx;
      this.y = cy + ry;
    }
    draw(){
      const s = this.size * (0.5 + this.depthFactor);
      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(s, 0.3), 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = 0.55 + this.depthFactor * 0.45;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 8 * this.depthFactor + 3;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  class Spark{
    constructor(){
      const a = rand(0, Math.PI * 2);
      const spd = rand(2, 14);
      this.x = cx; this.y = cy;
      this.vx = Math.cos(a) * spd;
      this.vy = Math.sin(a) * spd;
      this.life = 1;
      this.decay = rand(0.01, 0.03);
      this.size = rand(0.8, 2.4);
      this.color = Math.random() < 0.5 ? '#fff3d6' : COLORS[Math.floor(Math.random()*COLORS.length)];
    }
    update(){
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.97;
      this.vy *= 0.97;
      this.life -= this.decay;
    }
    draw(){
      if(this.life <= 0) return;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = Math.max(this.life, 0);
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  function initParticles(){
    particles = [];
    for(let i = 0; i < PARTICLE_COUNT; i++){
      particles.push(new Particle());
    }
  }

  function burst(){
    sparks = [];
    for(let i = 0; i < 140; i++){
      sparks.push(new Spark());
    }
  }

  // ---------- Idle (pre-trigger) render: pure dark, glow handled by CSS ----------
  function clearFull(){
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);
  }

  let lastT = 0;
  function animate(ts){
    const t = ts * 0.001;

    if(!triggered){
      // keep canvas simply dark; the DOM glow handles the resting state
      clearFull();
      requestAnimationFrame(animate);
      return;
    }

    // trailing fade
    ctx.fillStyle = 'rgba(5, 5, 5, 0.18)';
    ctx.fillRect(0, 0, W, H);

    // core glow (always drawn under particles once triggered)
    const elapsed = t - startTime;
    const coreGrow = Math.min(elapsed / 1.2, 1);
    const coreR = 26 * coreGrow;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 6);
    grad.addColorStop(0, 'rgba(255,247,224,' + (0.9 * coreGrow) + ')');
    grad.addColorStop(0.25, 'rgba(212,168,67,' + (0.55 * coreGrow) + ')');
    grad.addColorStop(0.6, 'rgba(107,76,154,' + (0.22 * coreGrow) + ')');
    grad.addColorStop(1, 'rgba(5,5,5,0)');
    ctx.beginPath();
    ctx.fillStyle = grad;
    ctx.arc(cx, cy, coreR * 6, 0, Math.PI * 2);
    ctx.fill();

    // particles
    for(let i = 0; i < particles.length; i++){
      const p = particles[i];
      p.update(t);
      p.draw();
    }

    // implosion sparks
    if(sparks.length){
      for(let i = sparks.length - 1; i >= 0; i--){
        sparks[i].update();
        sparks[i].draw();
        if(sparks[i].life <= 0) sparks.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  function trigger(){
    if(triggered) return;
    triggered = true;

    // fade out the prompt and resting glow permanently
    prompt.style.opacity = '0';
    restGlow.style.opacity = '0';
    setTimeout(() => {
      prompt.style.display = 'none';
      restGlow.style.display = 'none';
    }, 900);

    // screen flash for the implosion/explosion feel
    flash.style.transition = 'opacity 0.12s ease-out';
    flash.style.opacity = '0.9';
    setTimeout(() => {
      flash.style.transition = 'opacity 0.9s ease-in';
      flash.style.opacity = '0';
    }, 130);

    initParticles();
    burst();
    startTime = performance.now() * 0.001;

    // reveal the core name
    setTimeout(() => {
      coreName.classList.add('show');
    }, 260);

    // final message after 4s of orbiting
    setTimeout(() => {
      finalMessage.classList.add('show');
    }, 4000);
  }

  canvas.addEventListener('click', trigger);
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    trigger();
  }, { passive:false });

})();
</script>
</body>
</html>
